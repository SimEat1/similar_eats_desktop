name: similar_eats_desktop
description: Offline mock simulation of Similar Eats desktop
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  collection: ^1.18.0
  intl: any
  meta: any

  # Firebase core packages (desktop-safe)
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_database: ^12.0.4
  firebase_remote_config: ^6.1.1
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

  # Maps / geo / utils
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1

  # Files / images / parsing
  file_picker: ^10.3.3
  image: ^4.5.4
  zxing2: ^0.2.4

  # Desktop drag-and-drop
  desktop_drop: ^0.4.4

  # OCR + image pick (safe on desktop)
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_commons: ^0.8.1
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # for integration_test runner
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/food1.jpg
    - assets/food2.jpg
    - assets/food3.jpg
    - assets/food4.jpg



